<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 2 58 58">
  <title>Mon p’tit président</title>
  <!-- Static copy of src/components/app-logo.tsx, with thicker outlines to stay legible at 16px. -->
  <style>
    .outline { stroke: #18181b; }
    .dot { fill: #18181b; }
    @media (prefers-color-scheme: dark) {
      .outline { stroke: #fafafa; }
      .dot { fill: #fafafa; }
    }
  </style>
  <defs>
    <path id="hat" d="M11 20.5C17 18 20 6 32 6C44 6 47 18 53 20.5C44 17.5 20 17.5 11 20.5Z" transform="translate(32 15) rotate(-8) scale(.88) translate(-32 -16)"/>
    <!-- The hat knocks the chair out behind it. -->
    <mask id="behind-hat" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <use href="#hat" fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g fill="#dc2626">
    <g mask="url(#behind-hat)">
      <path d="M18 43V27Q18 17 32 17Q46 17 46 27V43Z"/>
      <rect x="9.75" y="33" width="7" height="10" rx="3.5"/>
      <rect x="47.25" y="33" width="7" height="10" rx="3.5"/>
      <rect x="12" y="43" width="40" height="6.5" rx="2.5"/>
    </g>
    <use href="#hat"/>
  </g>
  <g class="outline" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <g mask="url(#behind-hat)">
      <path d="M18 43V27Q18 17 32 17Q46 17 46 27V43"/>
      <rect x="9.75" y="33" width="7" height="10" rx="3.5"/>
      <rect x="47.25" y="33" width="7" height="10" rx="3.5"/>
      <rect x="12" y="43" width="40" height="6.5" rx="2.5"/>
      <path d="M17.5 49.5q-.5 4 -3 7M46.5 49.5q.5 4 3 7"/>
    </g>
    <path d="M28.6 27.8a3.6 3.6 0 1 1 5.2 3.2c-1.2 .6 -1.8 1.4 -1.8 2.8"/>
    <use href="#hat"/>
  </g>
  <circle class="dot" cx="32" cy="37.8" r="2"/>
</svg>
